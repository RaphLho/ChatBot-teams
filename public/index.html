<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistant Étudiant RAG</title>
    <meta name="description" content="Assistant pédagogique IA avec RAG et Mistral AI pour étudiants">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Assistant RAG</h2>
                <span class="badge">Mistral AI</span>
            </div>

            <!-- Navigation Tabs -->
            <nav class="sidebar-nav">
                <button class="nav-tab active" data-tab="chat" id="nav-chat">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                    </svg>
                    Discussion
                </button>
                <span id="nav-stats-slot"></span>
            </nav>

            <div class="sidebar-content">
                <p class="sidebar-desc">Posez vos questions sur vos cours, je rechercherai dans la documentation pour
                    vous répondre avec précision.</p>
                <div class="status-indicator">
                    <span class="pulse"></span>
                    En ligne et prêt
                </div>
            </div>
            <div class="sidebar-footer" style="display:flex; flex-direction:column; gap:12px;">
                <button id="new-chat-btn" class="secondary-btn">Nouvelle conversation</button>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-section" id="chat-page">
            <header class="chat-header">
                <h1>Discussion</h1>
                <div class="header-actions">
                <button type="button" class="mode-selector-btn" id="export-chat-btn" title="Exporter la conversation">
                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    <span>Exporter</span>
                </button>
                <div class="mode-selector" id="mode-selector">
                    <button type="button" class="mode-selector-btn" id="mode-selector-btn">
                        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
                        <span id="mode-selector-label">Mode normal</span>
                        <svg class="mode-selector-chevron" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                    </button>
                    <div class="mode-selector-menu" id="mode-selector-menu">
                        <button type="button" class="mode-option" data-mode="etudiant">
                            <div class="mode-option-icon">
                                <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c0 2 3 3 6 3s6-1 6-3v-5"/></svg>
                            </div>
                            <div class="mode-option-text">
                                <span class="mode-option-title">Tester en tant qu'étudiant</span>
                                <span class="mode-option-desc">Réponses basées uniquement sur les documents du dossier Étudiant</span>
                            </div>
                            <svg class="mode-option-check" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                        </button>
                        <button type="button" class="mode-option" data-mode="collaborateur">
                            <div class="mode-option-icon">
                                <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
                            </div>
                            <div class="mode-option-text">
                                <span class="mode-option-title">Tester en tant que Collaborateur</span>
                                <span class="mode-option-desc">Aide sur les outils et thématiques internes de l'entreprise</span>
                            </div>
                            <svg class="mode-option-check" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                        </button>
                    </div>
                </div>
                </div>
            </header>

            <div class="chat-container" id="chat-container">
                <div class="message bot">
                    <div class="avatar"><svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg></div>
                    <div class="bubble">
                        <p>Bonjour ! Je suis votre assistant pédagogique IA.</p>
                        <p>Posez-moi vos questions sur les cours et je ferai de mon mieux pour vous aider !</p>
                    </div>
                </div>
            </div>

            <div class="input-area">
                <form id="chat-form">
                    <textarea id="message-input" placeholder="Posez votre question à propos du cours..." rows="1"
                        required></textarea>
                    <button type="submit" id="send-btn" title="Envoyer">
                        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2"
                            fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </form>
            </div>
        </main>

    <!-- Script inclus avec marked.js pour supporter le Markdown en réponse -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
