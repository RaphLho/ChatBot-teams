<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — Assistant RAG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>

<body class="login-body">
    <div class="login-card">
        <div class="login-header">
            <div class="login-icon">
                <svg viewBox="0 0 24 24" width="26" height="26" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
                </svg>
            </div>
            <h1>Assistant RAG</h1>
            <p>Connectez-vous avec votre compte Microsoft pour accéder au chatbot</p>
        </div>

        <p id="sso-error" class="login-error" style="display: none;"></p>

        <a href="/auth/login" id="ms-login-btn" class="login-submit"
           style="display:flex; align-items:center; justify-content:center; gap:10px; text-decoration:none;">
            <svg width="18" height="18" viewBox="0 0 21 21" aria-hidden="true">
                <rect x="1" y="1" width="9" height="9" fill="#f25022"/>
                <rect x="11" y="1" width="9" height="9" fill="#7fba00"/>
                <rect x="1" y="11" width="9" height="9" fill="#00a4ef"/>
                <rect x="11" y="11" width="9" height="9" fill="#ffb900"/>
            </svg>
            Se connecter avec Microsoft
        </a>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const ssoError = params.get('ssoError');
        if (ssoError) {
            const messages = {
                domain: "Ce compte Microsoft n'est pas autorisé à accéder à cet assistant.",
                denied: "La connexion Microsoft a été annulée.",
                failed: "La connexion Microsoft a échoué. Merci de réessayer.",
            };
            const el = document.getElementById('sso-error');
            el.textContent = messages[ssoError] || messages.failed;
            el.style.display = 'block';
        }
    </script>
</body>

</html>
